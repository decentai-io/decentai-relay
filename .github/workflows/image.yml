# The relay's image, ghcr.io/<owner>/relay:<version>, for amd64 and arm64. Published under the
# version in relay/__init__.py, once: a version that is out is never replaced, so a change is published
# by giving it a newer version. The package is public.
name: Image

on:
  push:
    branches: [main]
    paths:
      - "relay/**"
      - "tunnel/**"
      - "Dockerfile"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/relay

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: |
          pip install --quiet pytest cryptography
          python -m pytest tests -q

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Its version, and whether that is out already
        id: version
        run: |
          number=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' relay/__init__.py)
          echo "number=${number}" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "${IMAGE}:${number}" >/dev/null 2>&1; then
            echo "::notice::${number} is published already; give the relay a newer version to publish a change."
            echo "out=yes" >> "$GITHUB_OUTPUT"
          else
            echo "out=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
        if: steps.version.outputs.out == 'no'
      - uses: docker/setup-buildx-action@v3
        if: steps.version.outputs.out == 'no'
      - name: Build and publish
        if: steps.version.outputs.out == 'no'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=relay
          cache-to: type=gha,scope=relay,mode=max
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.number }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.title=DecentAI relay
            org.opencontainers.image.description=A relay that reaches a computer behind NAT, with end-to-end TLS
            org.opencontainers.image.version=${{ steps.version.outputs.number }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
