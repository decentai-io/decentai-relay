name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The relay and the tunnel, end to end
        run: |
          pip install --quiet pytest cryptography
          python -m pytest tests -q
      - name: The setup script
        run: shellcheck deploy/setup.sh
      - name: The image builds and starts
        run: |
          docker build -t decentai-relay:test .
          docker run --rm --entrypoint python3 decentai-relay:test -m tunnel --version
